# System: the default theme. It follows your desktop: light or dark as the desktop is set, and the look of
# the desktop's own default theme (COSMIC, GNOME, KDE Plasma, Cinnamon, Hyprland), with a neutral FileHarbor
# palette on other desktops. The accent colour is coral; turn on "Use the desktop's accent colour" in the
# Appearance window to take the colour you picked in your desktop settings instead.
[Theme]
Name=System
Description=Follows your desktop's light or dark mode and default look, with a coral accent.
Adaptive=true
