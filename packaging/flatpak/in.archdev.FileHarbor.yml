# Flatpak manifest for FileHarbor (Flathub app id in.archdev.FileHarbor).
#
#   flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/in.archdev.FileHarbor.yml
#   flatpak run in.archdev.FileHarbor
#
# Everything is fetched from pinned sources (no network at build time), as Flathub requires. The Python
# packages come from python3-modules.yaml (made with flatpak-pip-generator, see packaging/README.md).
# Limits of a sandboxed file manager: the embedded terminal runs inside the sandbox, not on the host
# (use `flatpak-spawn --host` for a host shell); devices and network mounts depend on the host's gvfs.
app-id: in.archdev.FileHarbor
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: nemo
rename-desktop-file: nemo.desktop
rename-icon: fileharbor

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .
    version: '25.08'
    autodownload: true
    autodelete: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # a file manager has to see your files
  - --filesystem=host
  # devices, network shares, trash (gvfs runs on the host)
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.gtk.vfs.*
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.FileManager1
  - --own-name=org.Nemo
  - --own-name=org.nemo.StorageSense
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'

modules:
  - name: libexif
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://github.com/libexif/libexif/releases/download/v0.6.25/libexif-0.6.25.tar.xz
        sha256: 62f74cf3bf673a6e24d2de68f6741643718541f83aca5947e76e3978c25dce83

  - name: libgsf   # reads Office files for Nemo's search helpers
    config-opts: [--disable-static, --disable-gtk-doc, --without-gdk-pixbuf, --disable-introspection]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgsf/1.14/libgsf-1.14.53.tar.xz
        sha256: 0eb59a86e0c50f97ac9cfe4d8cc1969f623f2ae8c5296f2414571ff0a9e8bcba

  - name: gtksourceview4
    buildsystem: meson
    config-opts: [-Dgtk_doc=false, -Dvapi=false, -Dglade_catalog=false]
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/gtksourceview.git
        tag: 4.8.4
        commit: 7fd3adb3134bbec167167bb6400e018e4f781eb9

  - name: vte
    buildsystem: meson
    config-opts: [-Dgtk4=false, -Dgtk3=true, -Dvapi=false, -Dgir=true, -D_systemd=false, -Dfribidi=true]
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/vte.git
        tag: 0.78.7
        commit: f5af90799923978cd41baa675cae5fd0f8309179

  - name: libxapp
    buildsystem: meson
    config-opts: [-Ddocs=false, -Dvapi=false, -Dapp-lib-only=true, -Dpy-overrides-dir=/app/lib/python3.13/site-packages]
    sources:
      - type: git
        url: https://github.com/linuxmint/xapp.git
        tag: 3.2.4
        commit: 8ed05581e0051edde79ed4e21f882ac5872097ce

  - name: cinnamon-desktop
    buildsystem: meson
    config-opts: [-Dalsa=false, -Dsystemd=disabled]
    sources:
      - type: git
        url: https://github.com/linuxmint/cinnamon-desktop.git
        tag: 6.6.2
        commit: 7c53123b0c1ff02d4001371441de22b2a154317a

  # the tools shell out to ffmpeg and ffprobe
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-debug
      - --disable-ffplay
      - --disable-ffnvcodec
      - --disable-vulkan
      - --enable-gpl
      - --enable-version3
    post-install:
      - mkdir -p /app/lib/ffmpeg
    sources:
      - type: git
        url: https://git.ffmpeg.org/ffmpeg.git
        tag: n7.1.5
        commit: eefb3654c445a9004712036be4ffb01a68b2c3e1

  # Pillow, PyYAML and Pygments (Markdown comes with the runtime)
  - python3-modules.yaml

  # optional features, bundled so they work out of the box (the tools still run without them)
  - name: libraw   # camera RAW pictures (dcraw_emu)
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://www.libraw.org/data/LibRaw-0.21.2.tar.gz
        sha256: fe7288013206854baf6e4417d0fb63ba4ed7227bf36fff021992671c2dd34b03

  - name: catdoc   # search in legacy MS Word files
    sources:
      - type: archive
        url: http://ftp.wagner.pp.ru/pub/catdoc/catdoc-0.95.tar.gz
        sha256: 514a84180352b6bf367c1d2499819dfa82b60d8c45777432fa643a5ed7d80796

  # Prettier (code formatting in the text editor): the npm package has no dependencies, and it needs node at
  # run time, so the SDK extension's node binary is copied next to it.
  - name: prettier
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/prettier && cp -r . /app/lib/prettier
      - install -Dm755 /usr/lib/sdk/node24/bin/node /app/bin/node
      - |
        printf '#!/bin/sh\nexec /app/bin/node /app/lib/prettier/bin/prettier.cjs "$@"\n' > /app/bin/prettier
        chmod 755 /app/bin/prettier
    sources:
      - type: archive
        url: https://registry.npmjs.org/prettier/-/prettier-3.10.1.tgz
        sha256: 8625d008f4f0d7d513509ecc269b4b2a551a6f1ea3a57ac880e13e84a434213c

  - name: fileharbor
    buildsystem: meson
    config-opts:
      - -Dtracker=false
      - -Dxmp=false
      - -Dgtk_doc=false
      - -Dselinux=false
      - -Dgtk_layer_shell=false
    post-install:
      # only the main launcher is exported
      - rm -f /app/share/applications/nemo-autostart.desktop /app/share/applications/nemo-autorun-software.desktop
      - install -Dm644 /run/build/fileharbor/packaging/flatpak/in.archdev.FileHarbor.metainfo.xml /app/share/metainfo/in.archdev.FileHarbor.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/asuka-405/FileHarbor/releases/download/v0.1.0/fileharbor-0.1.0.tar.gz
        sha256: 6a0c3af70ae0a20efc0e7fe1e3133390313cbe9d99e80bbf1bfd38a393dfba8f
